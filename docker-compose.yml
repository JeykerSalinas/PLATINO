# docker-compose.yml
version: "3.9"

services:
  ollama:
    image: ollama/ollama
    container_name: ollama-platino
    command: >
      sh -c "ollama pull llama3 && ollama serve"
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: platino-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: platino
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./platino-backend
      dockerfile: dockerfile
    container_name: platino-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./platino-backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/platino
    depends_on:
      - db
      - ollama

  frontend:
    build:
      context: ./platino-frontend
      dockerfile: dockerfile
    container_name: platino-frontend
    command: npm run dev -- --host
    volumes:
      - ./platino-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ollama_models:
  postgres_data:
