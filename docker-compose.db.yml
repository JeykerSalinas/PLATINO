version: "3.9"
services:
  db:
    image: postgres:15
    container_name: platino-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: platino
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
volumes:
  postgres_data:
